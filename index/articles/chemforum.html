<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Forum with Comments</title>

<style>
body {
    font-family: Arial;
    max-width: 700px;
    margin: auto;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

form {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

input, textarea {
    width: 100%;
    margin: 5px 0;
    padding: 8px;
}

button {
    margin-top: 5px;
    padding: 6px 10px;
    cursor: pointer;
}

.post {
    background: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.comment {
    background: #eee;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
}

.container{
        
        width: 90%;
        margin: 100px auto;
        font-size: 25px;
        background-color: rgba(255, 255, 255, 0.75);
        padding: 30px;
        border-radius: 16px;
        }
</style>

</head>
<body>
<div class="container">
<h1>💬 Simple Forum</h1>

<form id="form">
    <input type="text" id="title" placeholder="Question title" required>
    <textarea id="content" placeholder="Ask something..." required></textarea>
    <button type="submit">Post</button>
</form>

<div id="posts"></div>
</div>

<script>
const form = document.getElementById("form");
const postsDiv = document.getElementById("posts");
const title = document.getElementById("title");
const content = document.getElementById("content");

let posts = JSON.parse(localStorage.getItem("posts")) || [];

// CREATE POST
form.addEventListener("submit", function(e) {
    e.preventDefault();

    posts.push({
        id: Date.now(),
        title: title.value.trim(),
        content: content.value.trim(),
        comments: []
    });

    save();
    render();
    form.reset();
});

// RENDER
function render() {
    postsDiv.innerHTML = "";

    if (posts.length === 0) {
        postsDiv.innerHTML = "<p>No posts yet.</p>";
        return;
    }

    posts.forEach(post => {
        postsDiv.innerHTML += `
            <div class="post">
                <h3>${post.title}</h3>
                <p>${post.content}</p>

                <button onclick="editPost(${post.id})">Edit</button>
                <button onclick="deletePost(${post.id})">Delete</button>

                <hr>
                <h4>Comments</h4>

                ${
                    !post.comments || post.comments.length === 0
                    ? "<p>No comments yet.</p>"
                    : post.comments.map(c => `
                        <div class="comment">
                            <p>${c.text}</p>
                            <button onclick="editComment(${post.id}, ${c.id})">Edit</button>
                            <button onclick="deleteComment(${post.id}, ${c.id})">Delete</button>
                        </div>
                    `).join("")
                }

                <input id="comment-${post.id}" placeholder="Write a comment...">
                <button onclick="addComment(${post.id})">Add Comment</button>
            </div>
        `;
    });
}

// EDIT POST
function editPost(id) {
    const post = posts.find(p => p.id === id);

    const newTitle = prompt("Edit title:", post.title);
    const newContent = prompt("Edit content:", post.content);

    if (!newTitle || !newContent) return;

    post.title = newTitle.trim();
    post.content = newContent.trim();

    save();
    render();
}

// DELETE POST
function deletePost(id) {
    posts = posts.filter(p => p.id !== id);
    save();
    render();
}

// CREATE COMMENT
function addComment(postId) {
    const input = document.getElementById(`comment-${postId}`);
    const text = input.value.trim();

    if (!text) return;

    const post = posts.find(p => p.id === postId);

    post.comments.push({
        id: Date.now(),
        text
    });

    input.value = "";
    save();
    render();
}

// EDIT COMMENT
function editComment(postId, commentId) {
    const post = posts.find(p => p.id === postId);
    const comment = post.comments.find(c => c.id === commentId);

    const newText = prompt("Edit comment:", comment.text);
    if (!newText) return;

    comment.text = newText.trim();

    save();
    render();
}

// DELETE COMMENT
//length
function deleteComment(postId, commentId) {
    const post = posts.find(p => p.id === postId);

    post.comments = post.comments.filter(c => c.id !== commentId);

    save();
    render();
}

// SAVE
function save() {
    localStorage.setItem("posts", JSON.stringify(posts));
}

// LOAD
render();
</script>

</body>
</html>
